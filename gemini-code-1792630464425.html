<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Estratégico - Nicolas</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Librería para renderizar formato Markdown en el chat -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h2>Agente Estratégico de Marketing & Empleo</h2>
      <button class="btn-secondary" onclick="configurarApiKey()">🔑 Configurar API Key</button>
    </header>

    <main id="chat-box" class="chat-box">
      <div class="msg agent">
        <strong>Agente:</strong> Hola, Nicolas. Ya estoy listo. ¿Qué tema o tarea de mercadeo, ventas o búsqueda laboral quieres que analicemos hoy?
      </div>
    </main>

    <footer class="input-area">
      <textarea id="user-input" placeholder="Escribe tu consulta o tema a analizar, Nicolas..."></textarea>
      <div class="action-buttons">
        <button class="btn-primary" onclick="enviarConsulta()">Enviar</button>
        <button class="btn-outline" onclick="exportarHTML()">Exportar Informe HTML</button>
      </div>
    </footer>
  </div>

  <script src="js/systemPrompt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
